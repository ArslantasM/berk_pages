<h2>📖 개요</h2>
<p>반복자를 사용한 함수형 프로그래밍: 맵, 필터, 축소, zip, 체인, 지연 평가.</p>

<h2>🚀 빠른 시작</h2>
<pre><code>import iter

let numbers = [1, 2, 3, 4, 5]
let result = iter.from(numbers)
    .filter(|x| x % 2 == 0)
    .map(|x| x * 2)
    .collect()
// [4, 8]</code></pre>
